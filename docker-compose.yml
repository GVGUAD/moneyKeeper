services:
  postgres_v2:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moneykeeper_v2
    ports:
      - "5432:5432"
    volumes:
      - moneykeeper_v2_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moneykeeper_v2"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moneykeeper_v2_pg:
    name: moneykeeper_v2_pg
