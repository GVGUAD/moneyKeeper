# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Moneykeeper quality gates
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: ./scripts/check_no_legacy_finance_sql.sh
      - run: cargo test --all-targets -- --nocapture
      - run: cargo test --test migrations -- --nocapture
      - run: cargo test --test context_boundaries -- --nocapture
      - run: cargo test --test openapi -- --nocapture

  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: quality
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
