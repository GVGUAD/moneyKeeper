# fly.toml app configuration file generated for moneykeeper on 2026-04-22T12:39:08+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'moneykeeper'
primary_region = 'fra'

[build]

[env]
  SUPABASE_URL = "https://mivavgihqyjofjlzhphp.supabase.co"
  PUBLIC_URL   = "https://moneykeeper.fly.dev"
  MONOBANK_WEBHOOK_BASE_URL = "https://moneykeeper.fly.dev"
  BIND_ADDR    = "0.0.0.0:8080"
  RUST_LOG     = "moneykeeper=debug"
  LOG_FORMAT   = "json"
  CLASSIFICATION_AUTO_APPLY = "true"
  CLASSIFICATION_MODEL = "gpt-5.4-mini-2026-03-17"

# DATABASE_URL, FINANCE_V2_ENCRYPTION_KEY_ID, FINANCE_V2_ENCRYPTION_KEY,
# FINANCE_V2_WEBHOOK_DIGEST_KEY, OPENAI_API_KEY, and Gmail OAuth credentials are Fly secrets.
# The V2 DATABASE_URL must name the separate moneykeeper_v2 database.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
