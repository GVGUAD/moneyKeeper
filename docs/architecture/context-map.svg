<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title description">
  <title id="title">Moneykeeper bounded contexts and dependency direction</title>
  <desc id="description">HTTP APIs call public context facades, infrastructure implements inward ports, and independent Recurring and Reporting consumers read a shared outbox.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 28px system-ui,sans-serif;fill:#0f172a}.group{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.group-title{font:700 16px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:1.5;rx:8}.support{fill:#eff6ff;stroke:#2563eb}.core{fill:#f0fdf4;stroke:#16a34a}.feature{fill:#fff7ed;stroke:#ea580c}.report{fill:#faf5ff;stroke:#9333ea}.consumer{fill:#fefce8;stroke:#ca8a04}.label{font:600 15px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.small{font:12px system-ui,sans-serif;fill:#475569;text-anchor:middle}.edge{fill:none;stroke:#334155;stroke-width:1.4;marker-end:url(#arrow)}.event{fill:none;stroke:#7c3aed;stroke-width:1.5;stroke-dasharray:6 4;marker-end:url(#arrow)}.port{fill:none;stroke:#0284c7;stroke-width:1.5;stroke-dasharray:3 3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#ffffff"/>
  <text x="700" y="42" class="title" text-anchor="middle">Moneykeeper bounded contexts and dependency direction</text>

  <rect x="35" y="70" width="1330" height="110" class="group" rx="12"/>
  <text x="55" y="96" class="group-title">Inbound adapters</text>
  <rect x="545" y="110" width="310" height="48" class="box"/>
  <text x="700" y="140" class="label">HTTP API → owning public façade</text>

  <rect x="35" y="200" width="1330" height="350" class="group" rx="12"/>
  <text x="55" y="226" class="group-title">Bounded contexts</text>
  <rect x="75" y="255" width="270" height="78" class="box support"/>
  <text x="210" y="284" class="label">Supporting catalogs</text>
  <text x="210" y="307" class="small">Reference Data · Classification · Preferences</text>
  <rect x="390" y="255" width="220" height="78" class="box core"/>
  <text x="500" y="290" class="label">Ledger</text>
  <text x="500" y="312" class="small">financial core capabilities</text>
  <rect x="655" y="255" width="180" height="78" class="box feature"/>
  <text x="745" y="290" class="label">Banking</text>
  <rect x="880" y="255" width="180" height="78" class="box feature"/>
  <text x="970" y="290" class="label">Mail</text>
  <rect x="1105" y="255" width="180" height="78" class="box feature"/>
  <text x="1195" y="290" class="label">Recurring</text>
  <rect x="175" y="405" width="180" height="78" class="box feature"/>
  <text x="265" y="440" class="label">Sharing</text>
  <rect x="415" y="405" width="180" height="78" class="box feature"/>
  <text x="505" y="440" class="label">Loans</text>
  <rect x="655" y="405" width="180" height="78" class="box feature"/>
  <text x="745" y="440" class="label">Portfolio</text>
  <rect x="955" y="405" width="220" height="78" class="box report"/>
  <text x="1065" y="436" class="label">Reporting</text>
  <text x="1065" y="459" class="small">writer · queries · rebuilds</text>

  <path d="M700 158 V220 H210 V255" class="edge"/>
  <path d="M700 158 V220 H500 V255" class="edge"/>
  <path d="M700 158 V220 H745 V255" class="edge"/>
  <path d="M700 158 V220 H970 V255" class="edge"/>
  <path d="M700 158 V220 H1195 V255" class="edge"/>
  <path d="M700 158 V370 H265 V405" class="edge"/>
  <path d="M700 158 V370 H505 V405" class="edge"/>
  <path d="M700 158 V370 H745 V405" class="edge"/>
  <path d="M700 158 V370 H1065 V405" class="edge"/>

  <path d="M655 294 H610" class="port"/><path d="M655 310 H345" class="port"/>
  <path d="M1105 294 H610" class="port"/><path d="M355 444 H390 V333" class="port"/>
  <path d="M505 405 V333" class="port"/><path d="M745 405 V350 H610" class="port"/>

  <rect x="35" y="575" width="850" height="240" class="group" rx="12"/>
  <text x="55" y="602" class="group-title">Integration runtime</text>
  <rect x="90" y="635" width="230" height="60" class="box report"/>
  <text x="205" y="670" class="label">PostgreSQL outbox</text>
  <rect x="390" y="620" width="400" height="72" class="box consumer"/>
  <text x="590" y="647" class="label">RecurringEventConsumer</text>
  <text x="590" y="671" class="small">recurring-event-policy-v1</text>
  <rect x="390" y="720" width="400" height="72" class="box consumer"/>
  <text x="590" y="747" class="label">ReportingEventConsumer</text>
  <text x="590" y="771" class="small">reporting-projections-v1</text>
  <path d="M320 653 H390" class="event"/><path d="M320 677 V756 H390" class="event"/>
  <path d="M790 656 H840 V520 H1195 V483" class="event"/>
  <path d="M790 756 H900 V483 H1065" class="event"/>

  <rect x="915" y="575" width="450" height="240" class="group" rx="12"/>
  <text x="935" y="602" class="group-title">Infrastructure adapters</text>
  <rect x="970" y="645" width="340" height="58" class="box"/>
  <text x="1140" y="680" class="label">PostgreSQL repositories</text>
  <rect x="970" y="730" width="340" height="58" class="box"/>
  <text x="1140" y="765" class="label">Provider and crypto clients</text>
  <path d="M1140 645 V535" class="port"/>
  <path d="M970 759 H915 V350 H745 V333" class="port"/>

  <text x="700" y="838" class="small">Dependency rule: API → public/application → domain · infrastructure implements inward-facing ports</text>
</svg>
